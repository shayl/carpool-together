name: Driver reminders

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch due reminders
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${REMINDER_CRON_SECRET}" \
            https://carpool-together.vercel.app/api/reminders/dispatch
